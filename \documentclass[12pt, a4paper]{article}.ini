\section{WIREFRAMES E PROTÓTIPO DE INTERFACE}
% ════════════════════════════════════════════════════════════════════

\subsection{Decisões de Arquitetura de Interface}

As seguintes decisões técnicas orientam a arquitetura da interface do sistema:

\begin{itemize}
  \item \textbf{Abordagem \textit{mobile-first}:} o design foi concebido prioritariamente para smartphones, com telas de 320px a 480px de largura como base. Os layouts desktop e totem são extensões responsivas do design mobile.
  \item \textbf{Sistema de \textit{grid}:} utilização de \textit{grid} de 4 colunas para mobile, 8 colunas para tablet e 12 colunas para desktop, com \textit{gutter} de 16px.
  \item \textbf{Componentes reutilizáveis:} \textit{card} de produto, barra de navegação inferior (mobile), carregamento de cardápio dinâmico por unidade, componente de status do pedido e modal de consentimento LGPD.
  \item \textbf{Paleta de cores:} laranja-terra (\texttt{\#E67E22}), marrom-cacau (\texttt{\#6D3B2A}) e branco (\texttt{\#FFFFFF}) como cores primárias, com verde (\texttt{\#27AE60}) para confirmações e vermelho (\texttt{\#E74C3C}) para erros.
  \item \textbf{Tipografia:} fonte sans-serif humanista (Nunito ou Poppins); hierarquia com 3 tamanhos: título (24px/\textit{bold}), subtítulo (16px/\textit{semibold}), corpo (14px/\textit{regular}).
\end{itemize}

\subsection{Telas Projetadas}

O protótipo contempla as seguintes telas, organizadas por canal de atendimento:

\subsubsection{Canal: Aplicativo Móvel (\textit{Mobile-first})}

\begin{itemize}
  \item \textbf{T01 --- Splash Screen / Onboarding:} animação de abertura com logotipo da marca; breve apresentação do app em até 3 \textit{slides} com opção ``Pular'';
  \item \textbf{T02 --- Login:} campos de e-mail e senha; opção ``Esqueci minha senha''; botão ``Criar conta''; acesso como visitante (somente visualização de cardápio, sem pedido);
  \item \textbf{T03 --- Cadastro com Consentimento LGPD:} formulário com campos obrigatórios; \textit{checkbox} obrigatório de aceite da Política de Privacidade; \textit{checkbox} opcional para marketing; explicação clara do uso dos dados;
  \item \textbf{T04 --- Seleção de Unidade:} mapa com marcadores; lista com endereço, distância, horário e status (aberta/fechada); filtro por cidade;
  \item \textbf{T05 --- Cardápio da Unidade:} categorias em \textit{scroll} horizontal; \textit{grid} de produtos com foto, nome, preço e botão de adição; indicação de produtos sazonais e indisponíveis;
  \item \textbf{T06 --- Detalhe do Produto:} foto ampliada; descrição completa; opções de personalização; controle de quantidade; botão ``Adicionar ao Carrinho'';
  \item \textbf{T07 --- Carrinho:} lista de itens; campo para código promocional; resumo financeiro; resgate de pontos; botão ``Confirmar Pedido'';
  \item \textbf{T08 --- Checkout / Pagamento:} seleção de forma de pagamento; indicação visual de processamento externo; estados de carregamento e resultado (aprovado/recusado);
  \item \textbf{T09 --- Confirmação e Status do Pedido:} número do pedido em destaque; barra de progresso (recebido → em preparo → pronto → retirado); previsão de tempo;
  \item \textbf{T10 --- Programa de Fidelidade:} saldo de pontos; histórico; benefícios disponíveis para resgate;
  \item \textbf{T11 --- Perfil do Cliente:} dados editáveis; histórico de pedidos; gestão de dados pessoais (LGPD); opção de exclusão de conta.
\end{itemize}

\subsubsection{Canal: Totem de Autoatendimento}

\begin{itemize}
  \item \textbf{T12 --- Home do Totem:} botão ``Iniciar Pedido'' em destaque; login opcional com CPF; botões mínimos de 64px;
  \item \textbf{T13 --- Cardápio no Totem:} \textit{grid} 2×3 com imagens grandes; navegação por categorias em tela cheia; confirmação simplificada.
\end{itemize}

\subsubsection{Canal: Web (Desktop)}

\begin{itemize}
  \item \textbf{T14 --- Home Web:} layout em 12 colunas; \textit{header} com logo, navegação e carrinho; rodapé com links legais e política de privacidade;
  \item \textbf{T15 --- Cardápio Web:} \textit{sidebar} com categorias; área principal em \textit{grid} de 4 colunas; painel lateral do carrinho sempre visível.
\end{itemize}

