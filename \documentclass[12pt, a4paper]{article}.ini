\subsection{Diagrama da Jornada do Usuário}

O Diagrama da Jornada do Usuário (Figura~\ref{fig:jornada}) mapeia o percurso completo do cliente desde o primeiro contato com a interface até a retirada do pedido, evidenciando as etapas, decisões, estados do sistema e integrações com serviços externos.

\begin{figure}[H]
  \centering
  \includegraphics[width=0.55\textwidth]{histusuario.png}
  \caption{Diagrama da Jornada do Usuário (Canal App)}
  \label{fig:jornada}
\end{figure}

As etapas da jornada são:

\begin{itemize}
  \item \textbf{Etapa 1 --- Descoberta/Entrada:} o cliente abre o aplicativo. O sistema verifica se há sessão ativa. Se não houver, o cliente é direcionado para login ou cadastro.
  \item \textbf{Etapa 2 --- Cadastro com LGPD:} o cliente preenche o formulário de cadastro. O sistema exibe o aviso de privacidade e solicita consentimento explícito. Sem aceite, o cadastro não é concluído.
  \item \textbf{Etapa 3 --- Seleção de Unidade:} o cliente visualiza as unidades disponíveis e seleciona a desejada. O sistema carrega o cardápio específico da unidade.
  \item \textbf{Etapa 4 --- Navegação pelo Cardápio:} o cliente visualiza categorias e produtos. Produtos indisponíveis ou sazonais aparecem sinalizados. O cliente adiciona produtos ao carrinho.
  \item \textbf{Etapa 5 --- Revisão do Carrinho:} o cliente revisa itens, quantidades e valor total. Pode aplicar código de desconto ou resgatar pontos de fidelidade.
  \item \textbf{Etapa 6 --- Pagamento (Integração Externa):} o sistema apresenta as formas de pagamento. Encaminha ao serviço externo e aguarda resposta. Se aprovado, avança; se recusado, exibe erro e permite nova tentativa.
  \item \textbf{Etapa 7 --- Confirmação e Acompanhamento:} o sistema exibe tela de confirmação com número do pedido. O cliente acompanha o status em tempo real.
  \item \textbf{Etapa 8 --- Pós-Pedido:} após a retirada, os pontos de fidelidade são registrados. Campanhas personalizadas baseadas no histórico do cliente podem ser ativadas.
\end{itemize}

