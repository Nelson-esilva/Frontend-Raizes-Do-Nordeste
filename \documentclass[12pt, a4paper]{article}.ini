\section{LGPD E PRIVACIDADE DA INTERFACE}
% ════════════════════════════════════════════════════════════════════

\subsection{Base Legal e Princípios Adotados}

A conformidade com a Lei Geral de Proteção de Dados (Lei n.º 13.709/2018 --- LGPD) é um requisito não negociável do sistema da Rede Raízes do Nordeste. A interface foi projetada com os seguintes princípios como guias:

\begin{itemize}
  \item \textbf{Finalidade:} os dados coletados são utilizados exclusivamente para os fins informados ao titular: autenticação, gestão de pedidos, programa de fidelização e campanhas segmentadas.
  \item \textbf{Transparência:} a política de privacidade é acessível em linguagem clara, a partir de qualquer tela do sistema.
  \item \textbf{Necessidade:} o sistema não coleta dados além do mínimo necessário. Dados de localização são solicitados apenas com permissão explícita.
  \item \textbf{Segurança:} dados de pagamento não são armazenados no front-end nem transitam pela camada de interface.
  \item \textbf{Consentimento:} todo tratamento de dados para fins de marketing é condicionado a consentimento livre, informado e inequívoco do titular.
\end{itemize}

\subsection{Implementação na Interface}

\subsubsection{Tela de Cadastro (T03)}

\begin{itemize}
  \item \textit{Checkbox} obrigatório ``Li e aceito a Política de Privacidade e os Termos de Uso'' --- não é pré-marcado;
  \item \textit{Checkbox} opcional ``Aceito receber promoções'' --- separado do aceite obrigatório;
  \item Link direto para o documento completo da Política de Privacidade;
  \item Informação sobre quais dados são coletados e para qual finalidade.
\end{itemize}

\subsubsection{Perfil do Usuário e Direitos do Titular}

\begin{itemize}
  \item Seção ``Meus Dados e Privacidade'' com opções de: visualizar dados armazenados, editar dados cadastrais, revogar consentimento de marketing, solicitar exclusão/anonimização da conta;
  \item Ao solicitar exclusão, o sistema exibe aviso sobre o impacto e solicita confirmação com dupla etapa (digitar ``EXCLUIR'' + senha), em conformidade com o Art.\ 18 da LGPD.
\end{itemize}

\subsubsection{Coleta de Localização}

\begin{itemize}
  \item Permissão solicitada apenas na tela de seleção de unidade (T04), com mensagem clara;
  \item A localização é opcional --- o cliente pode buscar unidades manualmente;
  \item A localização não é armazenada de forma persistente.
\end{itemize}

\subsubsection{Comunicações e Notificações}

\begin{itemize}
  \item Notificações \textit{push} ativadas apenas mediante \textit{opt-in} explícito;
  \item O \textit{opt-in} de marketing pode ser revogado a qualquer momento no perfil;
  \item Todas as comunicações de marketing incluem link de descadastramento.
\end{itemize}

