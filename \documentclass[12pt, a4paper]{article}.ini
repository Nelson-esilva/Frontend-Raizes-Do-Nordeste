\section{INTRODUÇÃO}
% ════════════════════════════════════════════════════════════════════

\subsection{Contextualização}

A Rede ``Raízes do Nordeste'' é uma rede de lanchonetes que nasceu como um pequeno negócio familiar na cidade de Recife, Pernambuco, há pouco mais de seis anos, comandada por Dona Francisca e seus dois filhos. Com uma proposta centrada em levar a culinária nordestina --- tapiocas, cuscuz recheado, bolo de macaxeira, sucos regionais e cafés da manhã completos --- ao cotidiano urbano com rapidez, qualidade e identidade cultural, a rede conquistou um público fiel e se expandiu para diversas capitais e cidades do interior do Brasil.

Com o crescimento acelerado, surgiram desafios operacionais, tecnológicos e organizacionais que exigem uma solução de software robusta, escalável e alinhada às necessidades reais do negócio. O presente projeto, desenvolvido na trilha de Front-End, propõe a modelagem da interface digital do sistema de pedidos e fidelização da rede, contemplando múltiplos canais de atendimento e conformidade com a Lei Geral de Proteção de Dados (LGPD).

\subsection{Objetivos do Projeto}

O objetivo geral deste projeto é projetar, documentar e prototipar a interface Front-End do sistema da Rede Raízes do Nordeste, garantindo uma experiência de usuário coerente, acessível e funcional em múltiplos canais de atendimento: aplicativo móvel, totem de autoatendimento e versão web.

Os objetivos específicos são:

\begin{itemize}
  \item Identificar e documentar os requisitos funcionais e não funcionais do sistema com base no estudo de caso;
  \item Modelar os fluxos de interação por meio de diagramas de casos de uso e jornada do usuário;
  \item Criar wireframes de baixa fidelidade e protótipo navegável de alta interatividade no Figma;
  \item Demonstrar conformidade com a LGPD na interface, especialmente nos fluxos de cadastro e uso de dados pessoais;
  \item Elaborar um plano de testes de interface contemplando cenários positivos e negativos;
  \item Propor decisões técnicas justificadas quanto à arquitetura de informação, responsividade e design mobile-first.
\end{itemize}

\subsection{Principais Usuários do Sistema}

O sistema da Rede Raízes do Nordeste atende a cinco perfis principais de usuários, cada um com necessidades e permissões distintas:

\begin{itemize}
  \item \textbf{Cliente:} pessoa física que realiza pedidos pelos canais digitais (aplicativo, web ou totem), acompanha o status do pedido, participa do programa de fidelização e gerencia seus dados pessoais;
  \item \textbf{Atendente:} colaborador da unidade responsável pelo recebimento e gerenciamento de pedidos realizados no balcão, podendo consultar o sistema para apoiar o cliente;
  \item \textbf{Cozinha:} equipe responsável pelo preparo dos produtos, que recebe os pedidos confirmados e atualiza o status de cada item (em preparo, pronto);
  \item \textbf{Gerente / Administrador:} gestor da unidade ou da franqueadora, com acesso a relatórios de vendas, controle de estoque, métricas de desempenho e auditoria de operações sensíveis;
  \item \textbf{Sistema de Pagamento Externo:} serviço terceirizado responsável pelo processamento das transações financeiras, com o qual o sistema se integra via API para confirmar ou recusar pagamentos.
\end{itemize}

\subsection{Relevância do Sistema}

A digitalização da jornada do cliente é um elemento estratégico para a competitividade da Rede Raízes do Nordeste. A disponibilização de múltiplos canais de atendimento --- aplicativo oficial, totens de autoatendimento, atendimento humano no balcão e pedidos para retirada rápida (\textit{pick-up}) --- exige uma interface coesa, que garanta consistência na experiência independentemente do ponto de contato.

Além disso, a conformidade com a LGPD (Lei n.º 13.709/2018) não é apenas uma obrigação legal, mas também um diferencial de confiança para o cliente. O programa de fidelização, aliado ao tratamento responsável dos dados pessoais, representa a base para campanhas segmentadas e crescimento sustentável da base de clientes da rede.

