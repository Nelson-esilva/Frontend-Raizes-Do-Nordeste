\section{PLANO DE TESTES E EVIDÊNCIAS}
% ════════════════════════════════════════════════════════════════════

\subsection{Estratégia de Testes da Interface}

A estratégia de testes foca na validação da qualidade, usabilidade, responsividade e conformidade com os requisitos funcionais e não funcionais. Os testes são categorizados em:

\begin{itemize}
  \item \textbf{Testes Funcionais:} verificam se cada funcionalidade opera conforme os requisitos definidos;
  \item \textbf{Testes de Usabilidade:} avaliam se a interface é intuitiva, clara e eficiente;
  \item \textbf{Testes de Responsividade:} validam o comportamento do \textit{layout} em diferentes dispositivos e resoluções;
  \item \textbf{Testes de LGPD/Privacidade:} confirmam que os elementos de consentimento e gestão de dados estão presentes e funcionais;
  \item \textbf{Testes de Fluxo de Pagamento:} validam a representação do fluxo de integração com o serviço externo, incluindo cenários de erro.
\end{itemize}

