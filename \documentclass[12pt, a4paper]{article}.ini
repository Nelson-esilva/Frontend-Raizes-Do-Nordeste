\section{CONCLUSÃO}
% ════════════════════════════════════════════════════════════════════

O desenvolvimento deste projeto proporcionou uma experiência de aprendizado integrada, que reuniu conhecimentos de engenharia de requisitos, modelagem de sistemas, design de interface, arquitetura de informação, conformidade legal e planejamento de qualidade.

\subsection{Lições Aprendidas}

A análise do estudo de caso da Rede Raízes do Nordeste demonstrou que um sistema aparentemente simples --- um aplicativo de lanchonete --- esconde complexidades significativas quando se considera a pluralidade de canais, a diversidade de unidades, as regras de negócio de fidelização e as obrigações legais da LGPD.

A etapa de levantamento de requisitos revelou que é fundamental ir além dos requisitos explícitos e identificar necessidades implícitas. O fato de que diferentes unidades podem ter cardápios distintos, produtos sazonais e horários variados exige uma arquitetura de interface que trate o cardápio como um dado dinâmico por unidade, e não como uma lista estática.

A abordagem \textit{mobile-first} demonstrou seu valor na prática: ao projetar primeiro para telas pequenas, as decisões de hierarquia de informação foram mais cuidadosas e o resultado foi uma interface mais limpa e focada.

\subsection{Desafios Enfrentados}

O maior desafio foi conciliar a multicanalidade com a consistência de experiência. A integração com o serviço de pagamento externo também demandou reflexão cuidadosa: a interface não pode transmitir insegurança durante o processamento, mas também não pode dar falsa certeza enquanto aguarda a resposta do serviço externo. A conformidade com a LGPD revelou-se mais complexa do que aparenta: não basta adicionar um \textit{checkbox} --- é preciso garantir que todo o fluxo de dados seja rastreável e o consentimento seja granular e revogável.

\subsection{Pontos de Atenção para Evoluções Futuras}

\begin{itemize}
  \item Acessibilidade avançada: suporte completo a leitores de tela (VoiceOver, TalkBack) e modo de alto contraste;
  \item Internacionalização: suporte a múltiplos idiomas via arquivos de localização;
  \item Modo \textit{offline} no aplicativo: navegação no cardápio e composição de pedidos sem conexão;
  \item Testes automatizados de interface com Cypress ou Playwright;
  \item Personalização avançada do cardápio: algoritmo de recomendação baseado no histórico do cliente.
\end{itemize}

